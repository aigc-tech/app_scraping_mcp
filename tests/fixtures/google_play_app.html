<html>
  <head>
    <script type="application/ld+json">
      {
        "@context": "http://schema.org",
        "@type": "SoftwareApplication",
        "name": "Sample Play App",
        "applicationId": "com.example.app",
        "description": "<p>Play description</p>"
      }
    </script>
  </head>
  <body>
    <h1><span>Sample Play App</span></h1>
    <meta itemprop="url" content="https://play.google.com/store/apps/details?id=com.example.app">
    <div itemprop="description">Play <b>description</b> text.</div>
    <img srcset="https://example.com/play1.jpg 2x" />
    <img data-src="https://example.com/play2.jpg?w=1024" />
    <iframe allow="autoplay" src="https://video.example.com/watch" />
    <button data-trailer-url="https://cdn.example.com/trailer.mp4"></button>
  </body>
</html>
